<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
                <h1>Inventory Dashboard</h1>
            </div>
            <button id="addBtn" class="btn btn-primary">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                Add Product
            </button>
        </header>

        <main>
            <div class="tabs">
                <button class="tab-btn active" id="tabProducts">Products</button>
                <button class="tab-btn" id="tabPartMaster">Part Master</button>
            </div>

            <div class="table-container" id="productsSection">
                <table id="productsTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Family</th>
                            <th>Spec</th>
                            <th>Make</th>
                            <th>Stock</th>
                            <th>Price</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="productsBody">
                        <!-- Data will be populated here by JavaScript -->
                    </tbody>
                </table>
            </div>

            <div class="table-container" id="partMasterSection" style="display: none;">
                <table id="partMasterTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Family</th>
                            <th>Forge PN</th>
                            <th>Part No</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="partMasterBody">
                        <!-- Data will be populated here by JavaScript -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Modal for Add/Edit -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add Product</h2>
                <button class="close-btn" id="closeModalBtn">&times;</button>
            </div>
            <form id="productForm">
                <input type="hidden" id="productId">
                
                <div class="form-group">
                    <label for="family">Family</label>
                    <input type="text" id="family" required placeholder="e.g. Processors">
                </div>
                
                <div class="form-group">
                    <label for="spec">Spec</label>
                    <input type="text" id="spec" required placeholder="e.g. i7 3.2GHz">
                </div>
                
                <div class="form-group">
                    <label for="make">Make</label>
                    <input type="text" id="make" required placeholder="e.g. Intel">
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="stock">Stock</label>
                        <input type="number" id="stock" required min="0" value="0">
                    </div>
                    
                    <div class="form-group">
                        <label for="price">Price (Rs)</label>
                        <input type="number" id="price" required min="0" step="0.01" value="0.00">
                    </div>
                </div>
                
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline" id="cancelBtn">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Details</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal for Part Master Add/Edit -->
    <div id="partModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="partModalTitle">Add Part Master</h2>
                <button class="close-btn" id="closePartModalBtn">&times;</button>
            </div>
            <form id="partForm">
                <input type="hidden" id="partId">
                
                <div class="form-group">
                    <label for="partFamily">Family</label>
                    <input type="text" id="partFamily" required placeholder="e.g. Engine">
                </div>
                
                <div class="form-group">
                    <label for="forgePn">Forge PN</label>
                    <input type="text" id="forgePn" required placeholder="e.g. FG-100">
                </div>
                
                <div class="form-group">
                    <label for="partno">Part No</label>
                    <input type="text" id="partno" required placeholder="e.g. PN-200">
                </div>
                
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline" id="cancelPartBtn">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Details</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
